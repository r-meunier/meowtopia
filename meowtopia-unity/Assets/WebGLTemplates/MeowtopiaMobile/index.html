<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ea">
  <title>Meowtopia</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f4ea; color: #394139; font: 16px system-ui, sans-serif; overscroll-behavior: none; }
    #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; background: #f7f4ea; }
    #loading[hidden] { display: none; }
    progress { width: min(280px, 75vw); height: 12px; accent-color: #6a8f70; }
    button { min-height: 48px; padding: 12px 24px; border: 0; background: #6a8f70; color: white; font: inherit; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Meowtopia cat-care game"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <strong>MEOWTOPIA</strong>
      <span id="status">Getting your cat's home ready…</span>
      <progress id="progress" max="1" value="0" aria-label="Loading game"></progress>
      <button id="retry" hidden>Try again</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const retry = document.getElementById('retry');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Avoid rendering nine times as many pixels on a 3x-density phone screen.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true
    };
    function fail(error) {
      console.error(error);
      loading.hidden = false;
      status.textContent = "Your cat's home couldn't load. Please try again.";
      progress.hidden = true;
      retry.hidden = false;
    }
    retry.addEventListener('click', () => location.reload());
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = fail;
    loader.onload = () => createUnityInstance(canvas, config, value => {
      progress.value = value;
    }).then(() => {
      loading.hidden = true;
      canvas.focus({ preventScroll: true });
    }).catch(fail);
    document.body.appendChild(loader);
  </script>
</body>
</html>
