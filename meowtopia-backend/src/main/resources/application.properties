spring.application.name=meowtopia-backend

# Credentials come from meowtopia-backend/.env (git-ignored); copy .env.example to create it.
# Environment variables with the same names take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/meowtopia-db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.mode=always
# use hibernate to create the schema == create/update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#spring.main.lazy-initialization=true
server.error.include-message=always

# spring security
spring.security.user.password=${APP_SECURITY_PASSWORD}
logging.level.org.springframework.security=DEBUG
